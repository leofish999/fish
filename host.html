<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MISSION CONTROL｜主持人</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    
</head>

<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">🎛️ MISSION <strong>CONTROL</strong></div><span class="chip">HOST ONLY</span>
        </header>
        <section class="panel">
            <p class="kicker">PROJECTOR TIMER · 本機計時</p>
            <h1>主持人統一倒數</h1><label>選擇關卡<select id="hostMission"
                    style="padding:14px;background:#111a2e;color:white;border-radius:12px;border:1px solid #637193;width:100%"></select></label>
            <div id="timer" class="timer">10:00</div>
            <div id="password" class="password">通行碼即將公布</div>
            <p id="timerStatus" class="muted center">等待主持人開始</p>
            <div class="host-grid">
                <div><button id="timerStart">▶ 開始／繼續</button></div>
                <div><button id="timerPause" class="secondary">⏸ 暫停</button></div>
                <div><button id="timerEnd" class="secondary">⏹ 結束作答</button></div>
                <div><button id="timerReset" class="secondary">↺ 重設本關</button></div>
            </div>
            <p class="note">講解期間停止計時；每關開始前選擇新任務。這個倒數只顯示在主持人設備／投影，不會遠端鎖定學生手機。</p>
        </section>
        <!-- <section class="panel">
            <p class="kicker">LEVEL ACCESS</p>
            <h2>主持人通行碼</h2>
            <div id="codes"></div>
            <p class="small">通行碼請在開關時才公布。要改碼請修改 assets/js/config.js；純前端代碼可被查看，僅供現場控場。</p>
        </section> -->
        <section class="panel">
            <p class="kicker">FINAL LEADERBOARD</p>
            <h2>成績彙總（最後才公開）</h2><label>匯入隊長下載的 JSON 成績檔（可多選）<input id="files" type="file"
                    accept=".json,application/json" multiple></label>
            <div class="row"><button id="csv">匯出 CSV</button><button id="clear" class="secondary">清空匯入紀錄</button></div>
            <p id="notice" class="small"></p>
            <div id="board"></div>
            <p class="small">同組同關保留最早一筆有效紀錄；成績只存在此主持人瀏覽器記憶體，重新整理會清空，請先匯出 CSV。未完成的關卡不計分。</p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./assets/js/host.js"></script>
    <script src="./assets/js/block.js??v=2"></script>
</body>

</html>
